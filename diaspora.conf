# diaspora.conf - the peers of this repository, what moves between them and
# what an import must pass.  Read by diaspora (github.com/kev-cam/diaspora).
# Values run to the end of the line as written; comments are whole lines.
# Settings for one machine only go in diaspora.local.conf (not committed).

[diaspora]
	target = master
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix
	# a regression takes hours: the imports of a run are tested together,
	# and one by one only if that fails
	strategy = batch

# Sandia's Xyce, which this repository was forked from.
[peer "sandia"]
	url = https://github.com/Xyce/Xyce.git
	branch = master

# Commands run in the import worktree ($DIASPORA_SRC), which has a build
# tree of its own ($DIASPORA_BUILD, kept between runs): the installed Xyce
# and its build tree are not touched.  Configured as the installed build is
# (Trilinos from /usr/local), and again whenever an import changes a CMake
# file; smak does not write the version stamp, so it is written here.
[test "compile"]
	run = cd "$DIASPORA_SRC" && sig=$(git ls-files -s '*CMakeLists.txt' '*.cmake' | sha1sum) && { [ "$sig" = "$(cat "$DIASPORA_BUILD/.buildsys" 2>/dev/null)" ] || { smak -cmake -S "$DIASPORA_SRC" -B "$DIASPORA_BUILD" -DBUILD_SHARED_LIBS=ON -DCMAKE_CXX_FLAGS=-march=native -DCMAKE_C_FLAGS=-march=native -DCMAKE_INSTALL_PREFIX=/usr/local -DXyce_ADMS_MODELS=FALSE && echo "$sig" > "$DIASPORA_BUILD/.buildsys"; }; }
	run = mkdir -p "$DIASPORA_BUILD/src/UtilityPKG" && printf '#define XYCEBUILDTIMESTAMP "%s-(%s)"\n' "$(date +%Y%m%d%H%M)" "$(git -C "$DIASPORA_SRC" describe --always)" > "$DIASPORA_BUILD/src/UtilityPKG/timestamp.h"
	run = cd "$DIASPORA_BUILD" && smak -j"$(nproc)" all
	timeout = 4h

# The Xyce blocks of the regress harness (Xyce_Regression, the IHP PDK
# decks, PyMS), on the import's build and its utils/PyMS.  Many of their
# tests fail on master, so the gate is that no test fails that did not fail
# before the import; a new failure is run a second time before it counts.
# What fails on master is measured once (two to three hours) and trusted
# for a week.
[test "full-regression"]
	needs = compile
	run = "${SV2GHDL_SRC_ROOT:-/usr/local/src}/sv2ghdl/regress/regress" candidate --repo xyce --src "$DIASPORA_SRC" --build "$DIASPORA_BUILD" --failures "$DIASPORA_FAILURES"
	pass = no-new-failures
	retry = 1
	reference-age = 7d
	timeout = 8h

# Every import passes the full regression, whatever kind of change it is.
[require]
	default = full-regression
